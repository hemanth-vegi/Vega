<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vega Scam Shield</title>
  <style>
    :root {
      --bg: #12151a;
      --card-bg: #1a1e26;
      --text: #e6eaf0;
      --text-muted: #8c96a3;
      --primary: #e63946;
      --primary-hover: #ff4d5a;
      --safe: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #262c36;
    }
    body {
      width: 340px;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .header-title {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.2);
      color: var(--safe);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.4);
    }
    .preview-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .preview-row {
      margin-bottom: 6px;
    }
    .preview-row:last-child {
      margin-bottom: 0;
    }
    .preview-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .preview-value {
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: var(--primary-hover);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .results-card {
      margin-top: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .results-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge.safe {
      background: rgba(16, 185, 129, 0.2);
      color: var(--safe);
      border: 1px solid var(--safe);
    }
    .badge.verify {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
      border: 1px solid var(--warning);
    }
    .badge.danger {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .flags-list {
      margin: 6px 0;
      padding-left: 16px;
      font-size: 11px;
      color: #fca5a5;
    }
    .open-vega-link {
      display: block;
      margin-top: 10px;
      text-align: center;
      color: #60a5fa;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
    }
    .open-vega-link:hover {
      text-decoration: underline;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <span>🛡️ Vega Scam Shield</span>
    </div>
    <div id="server-status" class="status-badge">Checking...</div>
  </div>

  <div class="preview-card">
    <div class="preview-row">
      <div class="preview-label">Role / Title</div>
      <div id="preview-title" class="preview-value">Detecting tab...</div>
    </div>
    <div class="preview-row">
      <div class="preview-label">Company</div>
      <div id="preview-company" class="preview-value">--</div>
    </div>
    <div class="preview-row">
      <div class="preview-label">Page URL</div>
      <div id="preview-url" class="preview-value" style="font-size:11px; font-weight:normal; color:var(--text-muted);">--</div>
    </div>
  </div>

  <button id="ingest-btn" class="btn">
    <span>Capture & Check Scam</span>
  </button>

  <div id="results-panel" class="results-card hidden">
    <div class="results-row">
      <span>Scam Risk:</span>
      <span id="result-risk-badge" class="badge safe">SAFE</span>
    </div>
    <div class="results-row">
      <span>Profile Match:</span>
      <span id="result-match-score" style="font-weight:700; color:var(--safe);">0%</span>
    </div>
    <div id="result-flags-container" class="hidden">
      <div class="preview-label" style="color:#fca5a5;">Detected Red Flags:</div>
      <ul id="result-flags-list" class="flags-list"></ul>
    </div>
    <a id="open-vega-btn" href="#" class="open-vega-link">Open in Vega Workbench ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
