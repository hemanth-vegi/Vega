name: Vega CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Compile & Hermetic Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Compile Python Bytecode
        run: |
          python -m compileall -q -x "(\.venv|venv)" .

      - name: Execute Automated Verification Suite
        env:
          VEGA_CI_MODE: "1"
        run: |
          python tests/verify_vega_career.py
